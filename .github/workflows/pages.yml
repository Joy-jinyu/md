name: changelog

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: 生成更新日志页面
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/pages
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Pairdown changelog</title>
          <style>
          HTML
            jq -r '
              def variables: to_entries | map("  --\(.key): \(.value);") | join("\n");
              def palette: {background, foreground, strong, card, primary, "primary-text", border, "border-strong"};
              .cssVars |
              ":root {\n\(((.theme | {radius}) + (.light | palette)) | variables)\n}",
              "@media (prefers-color-scheme: dark) {\n:root {\n\(.dark | palette | variables)\n}\n}"
            ' theme.json
            cat <<'HTML'
            :root {
              color-scheme: light dark;
              --page-gutter: clamp(1rem, 4vw, 2rem);
              --card-padding: clamp(1.25rem, 5vw, 3rem);
              --release-tint: color-mix(in srgb, var(--primary-text) 6%, var(--card));
            }
            *, *::before, *::after { box-sizing: border-box; }
            body {
              margin: 0;
              background: var(--background);
              color: var(--foreground);
              font: 1rem/1.65 system-ui, sans-serif;
            }
            main {
              max-inline-size: 62rem;
              margin-inline: auto;
              padding: clamp(2.75rem, 8vw, 6rem) var(--page-gutter);
              overflow-wrap: anywhere;
            }
            h1, h2, h3 { color: var(--strong); }
            h1 {
              margin: 0 0 clamp(1.5rem, 4vw, 2.75rem);
              font-size: clamp(2rem, 5vw, 3.5rem);
              line-height: 1.08;
              letter-spacing: -.045em;
              text-wrap: balance;
            }
            .release {
              margin-block: 1.25rem 0;
              padding: var(--card-padding);
              border: 1px solid var(--border);
              border-radius: calc(var(--radius) * 2);
              background: var(--card);
            }
            .release:first-of-type {
              background: linear-gradient(145deg, var(--release-tint), var(--card) 62%);
              border-color: color-mix(in srgb, var(--primary-text) 24%, var(--border));
            }
            .release > :first-child { margin-block-start: 0; }
            .release > :last-child { margin-block-end: 0; }
            .release > h2:first-child {
              inline-size: fit-content;
              margin-block-end: .85rem;
              padding: .2em .7em;
              border: 1px solid var(--border-strong);
              border-radius: var(--radius);
              background: var(--background);
              color: var(--primary-text);
              font: 650 .875rem/1.5 ui-monospace, monospace;
            }
            .release > h2:first-child + p {
              max-inline-size: 46ch;
              margin-block: 0 1.35rem;
              color: var(--strong);
              font-size: clamp(1.2rem, 2.5vw, 1.5rem);
              font-weight: 600;
              line-height: 1.35;
              letter-spacing: -.02em;
              text-wrap: pretty;
            }
            .release:first-of-type > h2:first-child + p {
              font-size: clamp(1.5rem, 3.5vw, 2.25rem);
            }
            .release > :is(p, ul, ol, blockquote) { max-inline-size: 68ch; }
            .release li + li { margin-block-start: .4em; }
            .release li::marker { color: var(--primary-text); }
            .release :is(img, video) { max-inline-size: 100%; height: auto; }
            .release :is(pre, table) { display: block; overflow-x: auto; }
            a { color: var(--primary-text); text-underline-offset: .18em; }
            a:hover { text-decoration-thickness: .13em; }
            a:focus-visible { outline: 2px solid currentColor; outline-offset: .25em; }
            .release > p:last-child:has(> a[href*="/releases/tag/"]) {
              max-inline-size: none;
              margin-block-start: 1.6rem;
              padding-block-start: 1.25rem;
              border-block-start: 1px solid var(--border-strong);
            }
            .release > p:last-child > a[href*="/releases/tag/"] { font-weight: 650; }
          </style>
          </head>
          <body>
          <main>
          HTML
            gh api markdown --raw-field mode=gfm --raw-field context="$GITHUB_REPOSITORY" --field text=@CHANGELOG.md |
              awk '
                /^<h2([[:space:]][^>]*)?>v?[0-9]+\.[0-9]+\.[0-9]+([[:space:]+-]|<)/ {
                  if (in_release) print "</article>"
                  print "<article class=\"release\">"
                  in_release = 1
                }
                { print }
                END { if (in_release) print "</article>" }
              '
            printf '\n</main>\n</body>\n</html>\n'
          } > dist/pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
