<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="A day by the river, told in the pages of an interactive Pairdown Markdown journal."
    />
    <link rel="icon" href="./pairdown.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>Pairdown · River Notes</title>
  </head>
  <body>
    <main class="exhibit" aria-label="Pairdown's interactive journal">
      <canvas class="desk-art" id="desk-art" aria-hidden="true"></canvas>
      <header class="desk-header">
        <h1 class="brand">
          <img src="./pairdown.png" alt="" width="30" height="30" />Pairdown
        </h1>
        <nav aria-label="Main navigation">
          <a href="/">Open the editor</a>
          <a class="source-link" href="https://github.com/Joy-jinyu/md"
            >GitHub <span aria-hidden="true">↗</span></a
          >
        </nav>
      </header>
      <div
        class="stage"
        id="stage"
        tabindex="0"
        aria-label="Journal. Click the left page to go back or the right page to go forward. You can also drag the pages or use the arrow keys."
      >
        <canvas id="scene" aria-hidden="true"></canvas>
      </div>
      <canvas
        class="quill"
        id="quill"
        width="660"
        height="552"
        aria-hidden="true"
      ></canvas>
      <div class="sr-only" aria-live="polite">
        <span id="number">01 / 03</span
        ><span id="label">The landing and the tea shop</span>
      </div>
      <section
        class="transcript sr-only"
        id="transcript"
        aria-label="Journal text"
      ></section>
      <p id="fallback" hidden>
        The 3D journal is unavailable in this browser.
        <a href="/">Open the editor</a>.
      </p>
      <noscript
        ><p id="no-script">
          Enable JavaScript to read the 3D journal, or
          <a href="/">open the editor</a>.
        </p></noscript
      >
    </main>
    <script defer src="./desk.js"></script>
    <script type="module" src="./book.js"></script>
  </body>
</html>
